name: Browser acceptance
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Generate ephemeral test identities
        shell: bash
        run: |
          echo "BSL_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BSL_TEST_COORD_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Install pinned browser test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium and operating-system libraries
        run: npx playwright install --with-deps chromium
      - name: Start disposable synthetic demo
        shell: bash
        run: |
          echo "DB_PATH=$RUNNER_TEMP/bridge-street-browser.sqlite" >> "$GITHUB_ENV"
          printf '%s' "$BSL_TEST_PASSWORD" | DB_PATH="$RUNNER_TEMP/bridge-street-browser.sqlite" node user-admin.ts create Taylor supervisor
          printf '%s' "$BSL_TEST_COORD_PASSWORD" | DB_PATH="$RUNNER_TEMP/bridge-street-browser.sqlite" node user-admin.ts create Morgan coordinator
          DB_PATH="$RUNNER_TEMP/bridge-street-browser.sqlite" node server.ts > "$RUNNER_TEMP/bridge-street-browser.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bridge-street-browser.pid"
          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/auth/me > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/bridge-street-browser.log"; exit 1; fi
      - name: Playwright functional and responsive checks
        run: npx playwright test --config playwright.config.mjs
      - name: Upload screenshot evidence and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atelier-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
