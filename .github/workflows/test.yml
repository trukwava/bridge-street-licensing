name: Domain checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate ephemeral test identities
        shell: bash
        run: |
          echo "BSL_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BSL_TEST_COORD_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm test
      - name: Verify offline backup and restore safeguards
        run: node backup-test.ts
      - name: Integration checks against isolated synthetic database
        shell: bash
        run: |
          export DB_PATH="$RUNNER_TEMP/bridge-street-integration.sqlite"
          printf '%s' "$BSL_TEST_PASSWORD" | node user-admin.ts create Taylor supervisor
          printf '%s' "$BSL_TEST_COORD_PASSWORD" | node user-admin.ts create Morgan coordinator
          node server.ts > "$RUNNER_TEMP/bridge-street-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/api/auth/me > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/bridge-street-server.log"; exit 1; fi
          node integration.ts
